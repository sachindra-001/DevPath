[project]
name = "cpgs"
version = "0.1.0"
description = "Career Path Guidance System — roadmap platform with AI resource discovery (MVP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "passlib[argon2]>=1.7",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "slowapi>=0.1.9",
    "pgvector>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Top-level import packages: `app` (FastAPI backend) and `ai` (pipeline package)
# so api + ai share ONE virtualenv/process (DESIGN.md §31, AD-1).
[tool.hatch.build.targets.wheel]
packages = ["apps/api/app", "ai"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api", "ai"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "fastapi.Cookie", "fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.12"
mypy_path = "apps/api"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "ai/tests"]
addopts = "-q"
